name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare game files
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install three@0.128.0 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp node_modules/three/build/three.min.js www/three.min.js

      - name: Create Android project
        working-directory: app
        run: |
          npx cap init "Seat Rush" com.seatrush.game --web-dir www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk SeatRush.apk
          gh release create "v${{ github.run_number }}" SeatRush.apk --title "Seat Rush build ${{ github.run_number }}" --notes "Tap SeatRush.apk to download and install."

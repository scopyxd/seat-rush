<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html,body{margin:0;padding:0}</style>
<title>Seat Rush 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen WebGL ride through an endless city bus. Lobby (home + shop sheet) floats over the live scene; in play, HUD on top with a fever meter, the door with 3 waiting groups at the bottom. Single committed arcade look. */
:root{
  --night:#1b1838; --panel:rgba(22,20,48,.86); --slot:#2d2a5a; --card:#231f4a; --edge:#3a3570;
  --ink:#fff6ec; --muted:#b9b2dc; --gold:#ffc83d; --gold-deep:#e08a00; --bad:#ff4d64; --ok:#5dff8f; --hot:#ff5a2e;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:3}
#flash{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 60%,transparent 40%,var(--hot) 140%);opacity:0;transition:opacity .3s}
#rainbow{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .5s;background:linear-gradient(120deg,#ff2e88,#ffd34d,#5dff8f,#2ee6ff,#7b4dff,#ff2e88);background-size:400% 400%;mix-blend-mode:overlay;animation:rb 2s linear infinite}
body.hyper #rainbow{opacity:.55}
@keyframes rb{to{background-position:400% 0}}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:4;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;transition:opacity .25s}
.col{display:flex;flex-direction:column;gap:6px}
.col.r{align-items:flex-end}
.pill{background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;transition:transform .1s}
.pill.bump{transform:scale(1.12)}
.coin-ico{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3b0 0 18%,var(--gold) 40%,var(--gold-deep) 100%)}
.coin-ico.s{width:18px;height:18px}
.heat{width:132px;height:12px;border-radius:999px;background:var(--panel);overflow:hidden;position:relative}
.heat i{position:absolute;inset:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--hot));transition:width .15s}
.heat.fever i{background:linear-gradient(90deg,#ff2e88,var(--gold),#2ee6ff,#ff2e88);background-size:200% 100%;animation:fev .6s linear infinite}
@keyframes fev{to{background-position:200% 0}}
.heatlbl{font:400 12px var(--display);letter-spacing:1px;color:var(--muted);margin-top:-2px}
.heatlbl.on{color:var(--hot);animation:pulse .4s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.streak{font-family:var(--display);font-size:15px;background:var(--gold);color:#3a2200;border-radius:999px;padding:2px 10px;transition:transform .15s;align-self:flex-start}
body.hyper .streak{background:linear-gradient(90deg,#ff2e88,#ffd34d,#2ee6ff);background-size:300% 100%;animation:fev .5s linear infinite}
.row2{display:flex;gap:6px;align-items:center}
.hearts{background:var(--panel);border-radius:999px;padding:5px 12px;font-size:18px;letter-spacing:2px;color:var(--bad)}
.hearts .gone{color:#4a4878}
.pausebtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);cursor:pointer;display:grid;place-items:center}
.pausebtn span{display:flex;gap:4px}.pausebtn span i{display:block;width:4px;height:14px;border-radius:2px;background:var(--ink)}
.speed{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:var(--panel);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}

/* door */
.door{position:fixed;left:0;right:0;bottom:0;z-index:4;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:opacity .25s,transform .25s}
.doorIn{max-width:440px;margin:0 auto;background:var(--panel);border-radius:18px;padding:8px 10px 10px;pointer-events:auto}
.doorlabel{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;height:70px;border:0;border-radius:14px;background:var(--slot);cursor:grab;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0 6px 7px;transition:transform .15s,box-shadow .15s,opacity .2s;touch-action:none}
.slot .cnt{position:absolute;top:5px;left:8px;font:400 13px var(--display);color:var(--muted)}
.slot.sel{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.35)}
.slot.dead{opacity:.35}
.slot.lift .mini{opacity:.2}
.slot.enter .mini{animation:walk .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes walk{from{transform:translate(30px,-8px) rotate(12deg);opacity:0}}
body.lobby .hud,body.lobby .door,body.over .door{opacity:0;pointer-events:none}
body.lobby .door *{pointer-events:none}
body.lobby .door{transform:translateY(30px)}

/* characters (door, ghost, shop) */
.mini{position:relative;width:24px;height:42px;animation:idle 1.2s ease-in-out infinite;flex:none}
.mini:nth-child(3){animation-delay:.2s}.mini:nth-child(4){animation-delay:.4s}
@keyframes idle{50%{transform:translateY(-3px)}}
.mini b{position:absolute;left:0;right:0;bottom:0;height:25px;border-radius:10px 10px 5px 5px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.mini i{position:absolute;z-index:1;left:50%;top:1px;width:15px;height:15px;transform:translateX(-50%);border-radius:50%;background:#ffd2ad;box-shadow:inset 0 4px 0 var(--h)}
.mini u{position:absolute;z-index:2;left:50%;transform:translateX(-50%)}
.v-cap u,.s-fans u{top:-1px;width:17px;height:8px;border-radius:9px 9px 2px 2px;background:var(--k)}
.v-cap u::after,.s-fans u::after{content:"";position:absolute;right:-6px;bottom:0;width:9px;height:3px;border-radius:2px;background:var(--k)}
.s-fans u{--k:#fff}.s-fans b::after{content:"";position:absolute;left:2px;right:2px;top:1px;height:4px;border-radius:3px;background:#fff}
.v-hijab i{box-shadow:none;width:11px;height:12px;top:4px}
.v-hijab u{z-index:0;top:-2px;width:21px;height:24px;border-radius:50% 50% 42% 42%;background:var(--k)}
.v-glasses u,.v-elder u{top:6px;width:15px;height:5px;border:2px solid #15131f;border-radius:3px;background:rgba(200,230,255,.35);box-sizing:border-box}
.v-elder i{box-shadow:inset 0 4px 0 #ece8e2}
.v-kid{height:34px;width:20px}.v-kid b{height:19px}.v-kid i{width:13px;height:13px}
.v-big b{left:-3px;right:-3px;height:27px}
.s-party u{top:-12px;width:13px;height:14px;background:repeating-linear-gradient(135deg,#ffd34d 0 3px,#ff2e88 3px 6px);clip-path:polygon(50% 0,100% 100%,0 100%)}
.s-pharaoh i,.s-mummy i{box-shadow:none}
.s-pharaoh i{width:11px;height:12px;top:4px}
.s-pharaoh u{z-index:0;top:-2px;width:24px;height:24px;background:repeating-linear-gradient(0deg,#e8b84a 0 3px,#1d3fa6 3px 6px);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.s-astro i{box-shadow:0 0 0 3px rgba(190,230,255,.7),inset 0 4px 0 var(--h)}
.s-robot i{border-radius:3px;background:#b9c0d4;box-shadow:none}
.s-robot i::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:3px;background:repeating-linear-gradient(90deg,#2ee6ff 0 3px,transparent 3px 6px)}
.s-robot u{top:-5px;width:2px;height:6px;background:#b9c0d4}
.s-mummy i{background:repeating-linear-gradient(170deg,#f1ead6 0 3px,#cfc4a8 3px 4px)}
.s-mummy b::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(160deg,transparent 0 5px,rgba(241,234,214,.85) 5px 7px)}
.s-chef u{top:-11px;width:15px;height:12px;border-radius:7px 7px 2px 2px;background:#fff}
.s-cat u{top:-4px;width:17px;height:7px;background:var(--h);clip-path:polygon(0 100%,15% 0,35% 100%,65% 100%,85% 0,100% 100%)}
.s-king u{top:-6px;width:15px;height:7px;background:#ffcf3a;clip-path:polygon(0 100%,0 20%,25% 60%,50% 0,75% 60%,100% 20%,100% 100%)}
.s-hero u{top:5px;width:16px;height:4px;border-radius:2px;background:#15131f}
.s-hero b::before{content:"";position:absolute;left:-3px;right:-3px;top:2px;bottom:-1px;border-radius:6px;background:#e0233c;z-index:-1}
.ghost{position:fixed;left:0;top:0;z-index:6;pointer-events:none;display:flex;gap:3px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));will-change:transform}
.ghost.ok{filter:drop-shadow(0 0 12px var(--ok))}

/* floating text */
.float{position:fixed;z-index:5;pointer-events:none;font-family:var(--display);color:var(--gold);text-shadow:0 3px 0 #7a3d00,0 0 18px rgba(255,200,61,.6);white-space:nowrap;transform:translate(-50%,-50%);animation:rise 1s ease-out forwards}
.float.big{font-size:34px}.float.mid{font-size:24px}.float.sm{font-size:18px;color:var(--ok);text-shadow:0 2px 0 #0a4a20}.float.bad{font-size:26px;color:var(--bad);text-shadow:0 3px 0 #5a0010}
.float.huge{font-size:84px;animation:count .7s ease-out forwards}
.float.fever{font-size:58px;color:#fff;text-shadow:0 4px 0 #ff2e88,0 0 30px #ff5a2e;animation:count 1.2s ease-out forwards}
.float.hyperT{font-size:clamp(46px,14vw,72px);background:linear-gradient(90deg,#ff2e88,#ffd34d,#5dff8f,#2ee6ff,#7b4dff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 20px #fff);animation:hyperIn 2s ease-out forwards}
@keyframes hyperIn{0%{transform:translate(-50%,-50%) scale(3) rotate(-10deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.1) rotate(-4deg);opacity:0}}
@keyframes rise{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
@keyframes count{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}

/* screens */
.screen{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box}
.screen.dim{background:rgba(20,14,40,.5)}
#home{justify-content:space-between;background:linear-gradient(180deg,rgba(27,24,56,.55) 0%,rgba(27,24,56,0) 30%,rgba(27,24,56,0) 46%,rgba(27,24,56,.88) 100%)}
.topchips{align-self:stretch;display:flex;justify-content:space-between;gap:8px;max-width:440px;width:100%;margin:0 auto}
.chip{background:var(--panel);border-radius:999px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.chip.nb{padding-left:12px}
.logo{text-align:center;transform:rotate(-4deg)}
.logo h1{margin:0;font:400 clamp(54px,17vw,84px)/.88 var(--display);color:var(--gold);text-shadow:0 5px 0 #b84a00,0 10px 0 rgba(0,0,0,.25),0 0 40px rgba(255,170,60,.45);letter-spacing:1px;animation:bob 2.4s ease-in-out infinite}
.logo h1 span{display:block;color:var(--ink);text-shadow:0 5px 0 #6b2f8a,0 10px 0 rgba(0,0,0,.25)}
@keyframes bob{50%{transform:translateY(-6px)}}
.logo p{margin:10px 0 0;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:12px;color:var(--ink);opacity:.85}
.homebottom{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--panel);border-radius:14px;padding:8px 8px 9px;text-align:center;font-size:12px;font-weight:700;line-height:1.2;color:var(--muted)}
.step strong{display:block;font:400 18px var(--display);color:var(--ink);margin-bottom:2px}
.play{border:0;border-radius:20px;background:var(--gold);color:#3a2200;font:400 36px var(--display);padding:14px 0;cursor:pointer;box-shadow:inset 0 -6px 0 var(--gold-deep),0 12px 30px rgba(255,170,40,.35);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
.homerow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shopbtn{border:0;border-radius:16px;background:#6b4dff;font:400 22px var(--display);padding:10px;cursor:pointer;box-shadow:inset 0 -4px 0 #4128b8;display:flex;align-items:center;justify-content:center;gap:8px}
.shopbtn .dot{background:var(--bad);border-radius:999px;font:800 11px var(--body);padding:1px 7px}
.songbtn{border:0;border-radius:16px;background:var(--panel);font:400 16px var(--display);padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.songbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tog{border:0;border-radius:999px;background:var(--panel);padding:8px 12px;font:800 11px var(--body);letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.tog[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
.card{background:var(--card);border-radius:24px;padding:22px 20px;text-align:center;width:min(340px,100%);box-shadow:0 0 0 4px var(--edge),0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h2{font:400 36px var(--display);margin:0}
.card .sub{margin:-6px 0 0;color:var(--muted);font-weight:700}
.score{font:400 56px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:10px}
.badge{align-self:center;background:var(--ok);color:#073b1a;font:400 15px var(--display);border-radius:999px;padding:3px 12px;transform:rotate(-3deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--slot);border-radius:14px;padding:8px 4px}
.stat b{display:block;font:400 22px var(--display);font-variant-numeric:tabular-nums}
.stat small{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:14px;padding:12px;font:400 22px var(--display);cursor:pointer;background:var(--gold);color:#3a2200;box-shadow:inset 0 -4px 0 var(--gold-deep)}
.btn.ghosty{background:var(--slot);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}

/* shop sheet */
#shop{justify-content:flex-end;padding-bottom:0;background:linear-gradient(180deg,rgba(27,24,56,0) 30%,rgba(27,24,56,.6) 100%)}
.sheet{width:100%;max-width:480px;height:min(64vh,560px);background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -4px 0 var(--edge),0 -20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 12px);box-sizing:border-box;gap:10px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheethead h2{font:400 30px var(--display);margin:0}
.close{border:0;width:38px;height:38px;border-radius:12px;background:var(--slot);font:400 20px var(--display);cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;background:var(--slot);padding:7px 14px;font:400 15px var(--display);cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--gold);color:#3a2200}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;touch-action:pan-y;padding-bottom:4px}
.item{background:var(--slot);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item.on{box-shadow:inset 0 0 0 3px var(--ok)}
.sw{height:70px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:6px;box-sizing:border-box}
.sw.glyph{align-items:center;font:400 34px var(--display);padding:0}
.sw .pyr{position:absolute;bottom:28%;width:34px;height:26px;background:#c9a067;clip-path:polygon(50% 0,100% 100%,0 100%)}
.bus-sw{position:absolute;inset:14px 10px 10px;border-radius:10px 10px 6px 6px}
.bus-sw::before{content:"";position:absolute;left:0;right:0;top:44%;height:16%;background:var(--st)}
.bus-sw::after{content:"";position:absolute;left:12%;right:12%;top:12%;height:24%;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(174,227,255,.75) 0 22%,var(--wl) 22% 28%)}
.bus-sw.rainbow{background:linear-gradient(90deg,#ff2e88,#ffd34d,#5dff8f,#2ee6ff,#7b4dff)!important}
.item h3{margin:0;font:400 16px var(--display);line-height:1.1}
.item p{margin:0;font-size:11px;font-weight:700;color:var(--muted);line-height:1.2;min-height:26px}
.buy{border:0;border-radius:10px;padding:7px;font:400 16px var(--display);cursor:pointer;background:var(--gold);color:#3a2200;box-shadow:inset 0 -3px 0 var(--gold-deep);display:flex;align-items:center;justify-content:center;gap:6px}
.buy.eq{background:#4b4790;color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.buy.done{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok);cursor:default}
.buy.poor{background:#3b3870;color:var(--muted);box-shadow:none}
@media (prefers-reduced-motion:reduce){.mini,.play,.logo h1,#rainbow{animation:none}}
</style>
</head>
<body>


<canvas id="gl"></canvas>
<div id="flash"></div><div id="rainbow"></div>
<canvas id="fx"></canvas>

<div class="hud">
  <div class="col">
    <div class="pill" id="coinbox"><span class="coin-ico"></span><span id="coins">0</span></div>
    <div class="heat" id="heat"><i id="heatFill"></i></div><div class="heatlbl" id="heatLbl">FEVER</div>
    <div class="streak" id="streak" hidden>x1</div>
  </div>
  <div class="col r"><div class="row2"><div class="hearts" id="hearts"></div><button class="pausebtn" id="pauseBtn" aria-label="Pause"><span><i></i><i></i></span></button></div><div class="speed" id="speed">0 km/h</div></div>
</div>
<div class="door" id="door"><div class="doorIn">
  <div class="doorlabel"><span>At the door</span><span>Drag up. It snaps.</span></div>
  <div class="slots" id="slots"></div>
</div></div>
<div class="ghost" id="ghost" hidden></div>

<div class="screen" id="home">
  <div class="topchips">
    <div class="chip"><span class="coin-ico s"></span><span id="walletTxt">0</span></div>
    <div class="chip nb"><small>Best</small><span id="bestTxt">0</span></div>
  </div>
  <div class="logo"><h1>SEAT<span>RUSH</span></h1><p>Cairo line · 3 | 3 seats</p></div>
  <div class="homebottom">
    <div class="steps">
      <div class="step"><strong>Grab</strong>a group at the door</div>
      <div class="step"><strong>Drop</strong>near a gap. Pairs can split.</div>
      <div class="step"><strong>Fill 6</strong>before the red line</div>
    </div>
    <button class="play" id="playBtn">PLAY</button>
    <div class="homerow">
      <button class="shopbtn" id="shopBtn">Shop <span class="dot" id="shopDot" hidden>NEW</span></button>

const liveRows=()=>rows.filter(r=>r.state==="live"&&r.z<camZ-MISS);
function options(row,n){
  const out=[];
  for(const side of [0,3]){
    const free=[0,1,2].map(o=>side+o).filter(c=>row.seats[c]==null);
    if(free.length<n)continue;
    let any=false;
    for(let st=0;st<=3-n;st++){let ok=true;for(let k=0;k<n;k++)if(row.seats[side+st+k]!=null)ok=false;if(ok){any=true;out.push({seats:Array.from({length:n},(_,k)=>side+st+k),split:false})}}
    if(!any)out.push({seats:free.slice(0,n),split:true});
  }
  return out;
}
const fitsAny=n=>liveRows().some(r=>options(r,n).length);
const pv=new THREE.Vector3();
function snapAt(x,y,n){
  let best=null,bd=Infinity;const R=Math.max(110,Math.min(innerWidth,innerHeight)*.28);
  for(const r of liveRows())for(const o of options(r,n)){
    const cx=o.seats.reduce((a,c)=>a+X[c],0)/n;
    pv.set(cx,.9,r.z).project(cam);
    const sx=(pv.x+1)/2*innerWidth,sy=(1-pv.y)/2*innerHeight,d=Math.hypot(sx-x,(sy-y)*1.25);
    if(d<bd){bd=d;best={row:r,seats:o.seats,split:o.split,sx,sy}}
  }
  return bd<R?best:null;
}

/* ---------- queue ---------- */
function genGroup(){
  const near=liveRows().sort((a,b)=>b.z-a.z).slice(0,4),fr=[];
  near.forEach(r=>[0,3].forEach(s=>{const f=[0,1,2].filter(o=>r.seats[s+o]==null).length;if(f)fr.push([f,r])}));
  let n,color=Math.floor(Math.random()*COLORS.length);
  if(fr.length&&Math.random()<.8){const [f,r]=pick(fr);n=Math.max(1,f-(Math.random()<.25?1:0));if(Math.random()<.6)color=r.color}
  else n=1+Math.floor(Math.random()*3);
  n=Math.min(3,n);
  return{n,color,members:Array.from({length:n},randVariant),dead:0};
}
function newGroup(i){
  const others=queue.filter((q,j)=>j!==i&&q).map(q=>q.n);let g;
  for(let t=0;t<6;t++){g=genGroup();if(!others.includes(g.n)&&(t>2||fitsAny(g.n)||!liveRows().length))return g}
  return g;
}

    b.id="slot-"+i;b.setAttribute("aria-label","Group of "+g.n);
    b.innerHTML=`<span class="cnt">${g.n}</span>`+g.members.map(v=>miniHTML(g.color,v)).join("");

/* ---------- placing, clearing, intensity ---------- */
const mult=()=>(hyper>0?3:fever>0?2:1)*(run.double?2:1);

  const g=queue[sel],row=s.row;
  g.members.forEach((v,k)=>addPax(row,s.seats[k],g.color,v,true,s.split?k*.08:0));
  coins+=g.n*mult();sfx(330+g.n*70,.08);burst(s.sx,s.sy,g.n*3,false);buzz(12);
  if(s.split)floatTxt("SPLIT!",s.sx,s.sy-30,"sm");
  heat=Math.min(1,heat+.03);
  if(row.seats.every(v=>v!=null))clearRow(row);
  queue[sel]=newGroup(sel);const enter=sel;

}

  const family=row.seats.every(v=>v===row.seats[0]);
  heat=Math.min(1,heat+.18+(family?.18:0)+Math.min(streak,5)*.03);
  if(heat>=1&&fever<=0&&hyper<=0){fever=7;fevers++;floatTxt("FEVER!",innerWidth/2,innerHeight*.38,"fever");sfxChord(8);buzz([40,30,40,30,80])}
  if(streak%10===0)startHyper();

  const [x,y]=rowScreen(row);burst(x,y,family?70:36,true);floatTxt("+"+pts,x,y-20,"mid");
  if(family)floatTxt("FAMILY ROW! x2",innerWidth/2,innerHeight*.28,"big");

  const st=$("streak");st.hidden=streak<2;st.textContent="Streak "+streak+" · x"+m;st.style.transform="scale(1.25)";setTimeout(()=>st.style.transform="",150);
  tween(.55,k=>row.mats.forEach(mm=>mm.emissive.setRGB(1*(1-k),.78*(1-k),.24*(1-k))));
  row.pax.forEach((p,i)=>{if(!p)return;p.userData.busy=true;tween(.5+i*.03,k=>{p.position.y=k*k*3.2+Math.sin(k*Math.PI)*.8;const s=Math.max(.05,1-k*.95);p.scale.set(s,s,s);p.rotation.y=k*7},()=>{row.g.remove(p);row.pax[i]=null})});

/* ---------- 2D fx: particles + speed lines ---------- */
const fx=$("fx"),ctx=fx.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1),parts=[];
const CONF=["#ff4f6a","#2fb8ff","#6fe05a","#ffc83d","#a96bff"];
const sprite=(w,h,draw)=>{const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);return c};
const IMG={
  coins:sprite(32,32,x=>{const g=x.createRadialGradient(12,12,1,16,16,16);g.addColorStop(0,"#fff3b0");g.addColorStop(.45,"#ffc83d");g.addColorStop(1,"#e08a00");x.fillStyle=g;x.beginPath();x.arc(16,16,15.5,0,Math.PI*2);x.fill()}),
  stars:sprite(32,32,x=>{x.fillStyle="#ffe066";x.beginPath();for(let k=0;k<10;k++){const rr=k%2?7:16,a=k*Math.PI/5-Math.PI/2;x.lineTo(16+Math.cos(a)*rr,16+Math.sin(a)*rr)}x.fill()}),

const confImgs=CONF.map(c=>sprite(8,16,x=>{x.fillStyle=c;x.fillRect(0,0,8,16)}));
function burst(x,y,n,big){
  const count=Math.min(180,260-parts.length,Math.round(n*(1+heat*2.5)*(fever>0?1.4:1)*(hyper>0?1.8:1)));
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=(big?5:3)+Math.random()*(big?8+heat*6:3);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(big?6:3),t:0,delay:.28+Math.random()*.25,r:5+Math.random()*4,rot:Math.random()*6,ci:Math.floor(Math.random()*5),h:Math.random()*360})}
}
let floats=0;
function floatTxt(t,x,y,cls){if(floats>5&&cls!=="huge"&&cls!=="fever"&&cls!=="hyperT")return;floats++;const d=document.createElement("div");d.className="float "+cls;d.textContent=t;d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);setTimeout(()=>{d.remove();floats--},cls==="hyperT"?2000:1200)}
function drawPart(p){
  const e=hyper>0?"rainbow":equipped.effects;
  if(e==="coins"){const w=p.r*Math.abs(Math.cos(p.t*9))+1.5;ctx.drawImage(IMG.coins,p.x-w,p.y-p.r,w*2,p.r*2);return}
  if(e==="rainbow"){ctx.fillStyle=`hsl(${(p.h+clock*400)%360},100%,60%)`;ctx.fillRect(p.x-p.r*.6,p.y-p.r*.6,p.r*1.2,p.r*1.2);return}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.t*6);
  if(e==="confetti")ctx.drawImage(confImgs[p.ci],-p.r*.5,-p.r,p.r,p.r*2);
  else if(e==="money")ctx.drawImage(IMG.money,-p.r*1.4,-p.r*.8,p.r*2.8,p.r*1.6);
  else ctx.drawImage(IMG[e],-p.r*1.1,-p.r*1.1,p.r*2.2,p.r*2.2);

const lines=[];for(let i=0;i<16;i++)lines.push({a:Math.random()*Math.PI*2,r:Math.random()});
const coinT={x:40,y:40};function measureCoin(){const t=$("coinbox").getBoundingClientRect();if(t.width){coinT.x=t.left+20;coinT.y=t.top+t.height/2}}
let shownTxt="",lastTick=0,fxIdle=false;
function drawFx(ts,dt){
  const showLines=state==="play"&&(speed>3.4||hyper>0);
  if(!parts.length&&!showLines){if(!fxIdle){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,fx.width,fx.height);fxIdle=true}}
  else{
    fxIdle=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    if(showLines){const cx=innerWidth/2,cy=innerHeight*.28,maxR=Math.hypot(innerWidth,innerHeight)*.7,k=hyper>0?1:Math.min(1,(speed-3.4)/2);
      ctx.lineWidth=2;for(const l of lines){l.r+=dt*(1.2+speed*.25)*.3;if(l.r>1){l.r=.15;l.a=Math.random()*Math.PI*2}const r0=l.r*maxR,r1=r0+40+l.r*90;
        ctx.strokeStyle=hyper>0?`hsla(${(l.a*57+clock*300)%360},100%,70%,${.35*l.r})`:`rgba(255,255,255,${.18*k*l.r})`;ctx.beginPath();ctx.moveTo(cx+Math.cos(l.a)*r0,cy+Math.sin(l.a)*r0*.6);ctx.lineTo(cx+Math.cos(l.a)*r1,cy+Math.sin(l.a)*r1*.6);ctx.stroke()}}
    const tx=coinT.x,ty=coinT.y;
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.t+=dt;
      if(p.t<p.delay){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.97}
      else{const k=Math.min(1,(p.t-p.delay)*3.2);p.x+=(tx-p.x)*k*.35;p.y+=(ty-p.y)*k*.35;
        if(Math.hypot(tx-p.x,ty-p.y)<14){parts.splice(i,1);const cb=$("coinbox");cb.classList.add("bump");clearTimeout(drawFx.b);drawFx.b=setTimeout(()=>cb.classList.remove("bump"),90);if(ts-lastTick>45){lastTick=ts;sfx(1200+Math.random()*500,.03)}continue}}
      drawPart(p);
    }

  if(shown<coins)shown=Math.min(coins,shown+Math.max(1,Math.ceil((coins-shown)*.12)));else shown=coins;
  const s=shown.toLocaleString();if(s!==shownTxt){shownTxt=s;$("coins").textContent=s}
}

/* ---------- audio ---------- */
let ac=null,sfxBus,musBus,noiseBuf;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
    sfxBus=ac.createGain();sfxBus.connect(comp);musBus=ac.createGain();musBus.gain.value=0;musBus.connect(comp);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    music.next=ac.currentTime+.1;setInterval(schedule,25);
  }catch(e){ac=null}}
  if(ac&&ac.state==="suspended")ac.resume();
}
let lastSfx=0;
function sfx(f,d,type="sine"){
  if(!ac||!settings.sound)return;const now=performance.now();if(now-lastSfx<25)return;lastSfx=now;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.12+heat*.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d+.08);o.connect(g).connect(sfxBus);o.start(t);o.stop(t+d+.1);
}
function sfxChord(l){[523,659,784,1047,1319,1568].slice(0,4+Math.round(heat*2)).forEach((f,i)=>setTimeout(()=>{lastSfx=0;sfx(f*(1+Math.min(l,8)*.05),.12,"triangle")},i*45))}
function buzz(p){if(!settings.vibe)return;const s=1+heat*1.8;const pat=(Array.isArray(p)?p:[p]).map((v,i)=>i%2?v:Math.round(v*s));try{navigator.vibrate&&navigator.vibrate(pat)}catch(e){}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,dur,type,vol,cut=4000,att=.01){
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type=type;o.frequency.value=mf(m);f.type="lowpass";f.frequency.value=cut;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(f).connect(g).connect(musBus);o.start(t);o.stop(t+dur+.05);
}
function kick(t,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(musBus);o.start(t);o.stop(t+.25)}
function noise(t,dur,ft,ff,v){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type=ft;f.frequency.value=ff;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(musBus);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
const music={step:0,next:0};
let lobbyShuffle=Math.floor(Math.random()*TRACKS.length);
const curTrack=()=>TRACKS[state==="play"||state==="count"||state==="paused"?runTrack:settings.track>=TRACKS.length?lobbyShuffle:settings.track];
function schedule(){
  if(!ac)return;
  const game=state==="play"||state==="count";
  const target=!settings.music?0:state==="paused"?.12:game?.32+heat*.25+(hyper>0?.1:0):.34;
  musBus.gain.setTargetAtTime(target,ac.currentTime,.3);
  const T=curTrack(),bpm=(game?T.bpm[1]+Math.min(speed||0,6)*4:T.bpm[0])*(hyper>0?1.2:1),st=60/bpm/4;
  if(music.next<ac.currentTime)music.next=ac.currentTime+.02;
  while(music.next<ac.currentTime+.12){playStep(T,music.step,music.next,st,game);music.next+=st;music.step=(music.step+1)%64}
}
function playStep(T,s,t,st,game){
  if(!settings.music)return;
  const bar=Math.floor(s/16),b=s%16,ch=T.ch[bar],h=hyper>0||fever>0?1:heat,mel=T.mel[s];
  if(!game){
    if(b===0)ch.forEach(m=>{tone(m,t,st*16,"sawtooth",.03,900,.4);tone(m+12,t,st*16,"triangle",.028,2000,.3)});
    if(b%2===0)tone(ch[(b/2)%3]+12+(b>=8?12:0),t,st*3,"triangle",.065,3000);
    if(b===0||b===10)tone(ch[0]-24,t,st*6,"sine",.22,400);
    if(mel)tone(mel,t,st*2.5,T.lead==="sawtooth"?"triangle":T.lead,.08,5000,.02);
    if(b===8)noise(t,.25,"bandpass",1800,.05);
    return;
  }
  if(b%4===0||(hyper>0&&b%2===0))kick(t,.75);
  if(b%2===1||b%4===2)tone(ch[0]-24,t,st*1.5,"sawtooth",.13,500+h*900);
  if(h>.15&&(b===4||b===12))noise(t,.16,"bandpass",1500,.32);
  if(h>.35&&b%2===1)noise(t,.05,"highpass",7000,.12);
  if(h>.55)tone(ch[s%3]+12+(b%8>=4?12:0),t,st*1.2,"square",.04,1800+h*2500);
  if((h>.75||fever>0)&&mel)tone(mel,t,st*2,T.lead,.05,3500);
  if(fever>0&&b%4===2)noise(t,.08,"highpass",9000,.1);
  if(hyper>0){tone(ch[(s*7)%3]+24+((s>>2)%2)*12,t,st*.9,"square",.035,6000);if(b===15)noise(t,st*4,"bandpass",3000+Math.random()*4000,.15)}
}

let shopTab="places";

  $("tabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{shopTab=b.dataset.tab;renderTabs();renderGrid();sfx(520,.04)}));

function swatch(cat,id,it){
  if(cat==="places")return`<div class="sw" style="background:linear-gradient(180deg,${hex(it.top)},${hex(it.mid)} 62%,${hex(it.sand)} 62%)">${it.pyramids?'<span class="pyr" style="left:14%"></span><span class="pyr" style="left:52%;transform:scale(1.3);transform-origin:bottom"></span>':""}</div>`;
  if(cat==="buses")return`<div class="sw" style="background:#141230"><div class="bus-sw${it.rainbow?" rainbow":""}" style="background:${hex(it.wall)};--st:${hex(it.stripe)};--wl:${hex(it.wall)}"></div></div>`;
  if(cat==="riders"){const vs=[{t:"hair",h:"#2a1b14",k:"#222"},{t:"kid",h:"#3d2a1e",k:"#222"},{t:"hijab",h:"#111",k:"#7a2048"}];return`<div class="sw" style="background:#141230">${vs.map((v,i)=>miniHTML(i,v,id)).join("")}</div>`}

function renderGrid(){
  const cat=SHOP[shopTab];$("shopWallet").textContent=wallet.toLocaleString();
  $("grid").innerHTML=Object.entries(cat.items).map(([id,it])=>{
    let btn;
    if(it.consumable)btn=`<button class="buy${wallet<it.price?" poor":""}" data-id="${id}"><span class="coin-ico s"></span>${it.price.toLocaleString()}${boosts[id]?` · ${boosts[id]} owned`:""}</button>`;
    else if(equipped[shopTab]===id)btn=`<button class="buy done" disabled>Equipped</button>`;
    else if(owned[shopTab].includes(id))btn=`<button class="buy eq" data-id="${id}">Equip</button>`;
    else btn=`<button class="buy${wallet<it.price?" poor":""}" data-id="${id}"><span class="coin-ico s"></span>${it.price.toLocaleString()}</button>`;
    return`<div class="item${equipped[shopTab]===id?" on":""}">${swatch(shopTab,id,it)}<h3>${it.name}</h3><p>${it.desc}</p>${btn}</div>`;
  }).join("");
  $("grid").querySelectorAll(".buy[data-id]").forEach(b=>b.addEventListener("click",()=>buy(shopTab,b.dataset.id)));

function buy(cat,id){
  const it=SHOP[cat].items[id];
  if(it.consumable){if(wallet<it.price)return nope();wallet-=it.price;boosts[id]++;store.set("boosts",boosts);cha()}
  else if(owned[cat].includes(id)){equipped[cat]=id;store.set("equipped",equipped);sfx(660,.06)}
  else{if(wallet<it.price)return nope();wallet-=it.price;owned[cat].push(id);equipped[cat]=id;store.set("owned",owned);store.set("equipped",equipped);cha()}
  store.set("wallet",wallet);applyAll(cat);renderGrid();updateLobby();
}
function cha(){sfxChord(3);burst(innerWidth/2,innerHeight*.35,30,true);buzz([20,30,40])}
function nope(){sfx(140,.12,"square");buzz(30);floatTxt("Need more coins",innerWidth/2,innerHeight*.3,"bad")}
function applyAll(cat){

function setState(s){
  state=s;document.body.classList.remove("lobby","over");if(s==="home"||s==="shop")document.body.classList.add("lobby");if(s==="over")document.body.classList.add("over");
  $("home").hidden=s!=="home";$("shop").hidden=s!=="shop";$("pause").hidden=s!=="paused";$("overScreen").hidden=s!=="over";
  if(s==="home")updateLobby();
  if(s==="shop"){renderTabs();renderGrid()}
  setTimeout(measureCoin,300);
}
function songLabel(){return settings.track>=TRACKS.length?"Shuffle":TRACKS[settings.track].name}
function updateLobby(){
  $("walletTxt").textContent=wallet.toLocaleString();$("bestTxt").textContent=best.toLocaleString();$("songName").textContent=songLabel();
  const cheapest=Math.min(...Object.entries(SHOP).filter(([k])=>k!=="boosts").flatMap(([k,c])=>Object.entries(c.items).filter(([id])=>!owned[k].includes(id)).map(([,it])=>it.price)));
  $("shopDot").hidden=!(wallet>=cheapest);
  const active=Object.entries(boosts).filter(([,n])=>n>0);
  $("boostLine").hidden=!active.length;
  $("boostLine").innerHTML=active.map(([id,n])=>`<span class="tog" aria-pressed="true">${SHOP.boosts.items[id].name} ×${n}</span>`).join("");
}
function clearRows(){rows.forEach(disposeRow);rows=[]}
function newRun(){
  clearRows();if(hyper>0)endHyper();nextZ=camZ-8;speed=1.9;coins=0;shown=0;streak=0;bestStreak=0;cleared=0;elapsed=0;heat=0;fever=0;fevers=0;
  run={double:false,slow:false};maxHearts=3;
  if(boosts.heart>0){boosts.heart--;maxHearts=4}
  if(boosts.double>0){boosts.double--;run.double=true}
  if(boosts.slow>0){boosts.slow--;run.slow=true}
  store.set("boosts",boosts);hearts=maxHearts;
  runTrack=settings.track>=TRACKS.length?Math.floor(Math.random()*TRACKS.length):settings.track;
  $("streak").hidden=true;
  for(let i=0;i<3;i++){makeRow(nextZ,true);nextZ-=GAP}
  spawn();queue=[null,null,null];for(let i=0;i<3;i++)queue[i]=newGroup(i);sel=0;renderSlots();renderHearts();
  setState("count");countT=0;countStep=-1;
  if(run.double)setTimeout(()=>floatTxt("x2 COINS",innerWidth/2,innerHeight*.55,"mid"),200);
}
function attract(){clearRows();nextZ=camZ-6;spawn()}
function spawn(){while(nextZ>camZ-AHEAD){makeRow(nextZ,state!=="play"||elapsed<15);nextZ-=GAP}}
function endGame(){
  if(state!=="play")return;
  if(hyper>0)endHyper();
  const isBest=coins>best;if(isBest){best=coins;store.set("best",best)}
  wallet+=coins;store.set("wallet",wallet);fever=0;heat=0;$("flash").style.opacity=0;
  $("overScore").textContent=coins.toLocaleString();$("newBest").hidden=!isBest;
  $("stRows").textContent=cleared;$("stStreak").textContent=bestStreak;$("stFever").textContent=fevers;
  setState("over");
}
function pause(){if(state==="play"||state==="count"){drag=null;ghost.hidden=true;preview.row=null;setState("paused")}}
function syncToggles(){[["musTog","musTog2","music"],["sndTog","sndTog2","sound"],["vibTog","vibTog2","vibe"]].forEach(([a,b,k])=>{$(a).setAttribute("aria-pressed",settings[k]);$(b).setAttribute("aria-pressed",settings[k])})}
[["musTog","music"],["musTog2","music"],["sndTog","sound"],["sndTog2","sound"],["vibTog","vibe"],["vibTog2","vibe"]].forEach(([id,k])=>$(id).addEventListener("click",()=>{audio();settings[k]=!settings[k];store.set(k,settings[k]);syncToggles();sfx(660,.06);if(k==="vibe")buzz(30)}));
$("songBtn").addEventListener("click",()=>{audio();settings.track=(settings.track+1)%(TRACKS.length+1);store.set("track",settings.track);if(settings.track>=TRACKS.length)lobbyShuffle=Math.floor(Math.random()*TRACKS.length);music.step=0;$("songName").textContent=songLabel();sfx(700,.05)});
$("playBtn").addEventListener("click",()=>{audio();newRun()});
$("againBtn").addEventListener("click",()=>{audio();newRun()});
$("restartBtn").addEventListener("click",()=>newRun());
$("resumeBtn").addEventListener("click",()=>setState("play"));
$("homeBtn").addEventListener("click",()=>{if(hyper>0)endHyper();setState("home");attract()});
$("homeBtn2").addEventListener("click",()=>{setState("home");attract()});
$("shopBtn").addEventListener("click",()=>{audio();setState("shop");sfx(620,.05)});
$("shopBtn2").addEventListener("click",()=>{setState("shop");attract()});
$("shopClose").addEventListener("click",()=>setState("home"));
$("pauseBtn").addEventListener("click",pause);
addEventListener("pointerdown",audio,{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});

for(const s of [-1,1])for(let i=0;i<12;i++)makeBuilding(s);
for(let i=0;i<12;i++)makePalm(-i*7-3);
for(let i=0;i<8;i++)makeLamp(-i*9,i%2?1:-1);
for(let i=0;i<3;i++)placeCar(makeCar(true),-20-i*22);
for(let i=0;i<2;i++)placeCar(makeCar(false),-15-i*25);

let missDirty=true;
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
  const hf=2*Math.atan(4.5/10),vf=2*Math.atan(Math.tan(hf/2)/cam.aspect)*180/Math.PI;
  cam.fov=Math.max(50,Math.min(96,vf));cam.userData.fov=cam.fov;cam.updateProjectionMatrix();
  fx.width=w*dpr;fx.height=h*dpr;fx.style.width=w+"px";fx.style.height=h+"px";fxIdle=false;missDirty=true;setTimeout(measureCoin,50);
}
function computeMiss(){
  cam.updateMatrixWorld();
  const doorTop=$("door").getBoundingClientRect().top,top=(doorTop>innerHeight*.5?doorTop:innerHeight-110)-14,v=new THREE.Vector3();
  for(let d=1;d<20;d+=.1){v.set(0,.5,camZ-d).project(cam);if((1-v.y)/2*innerHeight<top){MISS=d+.3;break}}
  missDirty=false;
}
addEventListener("resize",resize);

let last=performance.now(),hudKey="",frameN=0,slowT=0;
const hsl=new THREE.Color();
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000);last=ts;clock+=dt;frameN++;
  if(state==="count"){
    countT+=dt;const step=Math.floor(countT/.55);
    if(step!==countStep){countStep=step;if(step<3){floatTxt(String(3-step),innerWidth/2,innerHeight*.4,"huge");sfx(440,.12,"triangle")}else{floatTxt("GO!",innerWidth/2,innerHeight*.4,"huge");sfx(880,.2,"triangle");setState("play")}}
  }
  const playing=state==="play";
  if(playing){
    elapsed+=dt;
    speed=run.slow&&elapsed<20?1.6:Math.min(6,1.9+(run.slow?elapsed-20:elapsed)*.035);
    camZ-=speed*dt;spawn();
    for(const r of rows)if(r.state==="live"&&r.z>camZ-MISS)missRow(r);
    if(frameN%6===0)queue.forEach((q,i)=>{if(!fitsAny(q.n)){q.dead+=dt*6;if(q.dead>.8&&!(drag&&drag.i===i)){queue[i]=newGroup(i);renderSlots(i)}}else q.dead=0});
    if(frameN%15===0)updateSel();
    if(fever>0){fever-=dt;if(fever<=0){heat=.45;$("flash").style.opacity=0}}else heat=Math.max(0,heat-dt*.035);
    if(hyper>0){hyper-=dt;if(hyper<=0)endHyper()}
    const hw=(fever>0||hyper>0?100:Math.round(heat*50)*2)+"%",ht=hyper>0?"HYPER x3 · "+Math.ceil(hyper)+"s":fever>0?"FEVER x2 · "+Math.ceil(fever)+"s":"FEVER",key=hw+ht+(heat>.8)+Math.round(speed*26);
    if(key!==hudKey){hudKey=key;$("heatFill").style.width=hw;$("heat").classList.toggle("fever",fever>0||hyper>0);const lbl=$("heatLbl");lbl.textContent=ht;lbl.classList.toggle("on",fever>0||hyper>0||heat>.8);$("speed").textContent=Math.round(speed*26)+" km/h"}
  }else if(state==="home"||state==="over"||state==="shop"){
    camZ-=1.4*dt;spawn();
  }
  for(let i=rows.length-1;i>=0;i--)if(rows[i].z>camZ+6){disposeRow(rows[i]);rows.splice(i,1)}
  for(const g of segs)if(g.position.z>camZ+6)g.position.z-=SEGS*GAP;
  for(let i=buildings.length-1;i>=0;i--){const b=buildings[i];if(b.position.z-b.userData.w>camZ+12){scene.remove(b);buildings.splice(i,1);makeBuilding(b.userData.side)}}
  let pz=Infinity;for(const p of palms)pz=Math.min(pz,p.position.z);for(const p of palms){if(p.position.z>camZ+8){p.position.z=pz-7;pz-=7}p.rotation.z=Math.sin(clock*1.3+p.userData.ph)*.025}
  let lz=Infinity;for(const l of lamps)lz=Math.min(lz,l.position.z);for(const l of lamps)if(l.position.z>camZ+8){l.position.z=lz-9;lz-=9}
  const carSpeed=playing?speed:state==="paused"||state==="count"?0:1.4;
  for(const c of cars){const u=c.userData;if(state!=="paused")c.position.z+=u.oncoming?u.v*dt:-carSpeed*u.v*dt;if(c.position.z>camZ+10||c.position.z<camZ-80)placeCar(c,camZ-rand(50,70))}
  for(const u of ufos){const d=u.userData;if(!d.active)continue;u.position.x+=d.dir*d.v*dt;u.position.z=camZ-d.zo;u.position.y=d.y+Math.sin(clock*3+d.ph)*.6;u.rotation.y+=dt*2;
    d.beam.material.opacity=.12+.1*Math.sin(clock*12+d.ph);d.beam.material.color.setHSL((clock*.5+d.ph)%1,1,.6);
    if(Math.abs(u.position.x)>58){if(hyper>1)launchUfo(u);else{d.active=false;u.visible=false}}}
  if(hyper>0){const hh=(clock*.25)%1;hsl.setHSL(hh,.8,.25);skyU.top.value.copy(hsl);hsl.setHSL((hh+.33)%1,.9,.55);skyU.mid.value.copy(hsl);scene.fog.color.copy(hsl);hsl.setHSL((hh+.66)%1,.8,.3);skyU.bot.value.copy(hsl);
    VCbus.emissive.setHSL((hh+.5)%1,1,.22);if(frameN%3===0)bMats.forEach((b,i)=>b.m.emissive.setHSL((hh+i*.07)%1,1,.6));
    cam.fov=cam.userData.fov*(1+.03*Math.abs(Math.sin(clock*Math.PI*2.2)));cam.updateProjectionMatrix()}
  else{if(SHOP.buses.items[equipped.buses].rainbow)VCbus.emissive.setHSL((clock*.15)%1,1,.12);
    if(cam.userData.fov&&cam.fov!==cam.userData.fov){cam.fov=cam.userData.fov;cam.updateProjectionMatrix()}}
  const rainbowSeats=hyper>0||SHOP.buses.items[equipped.buses].rainbow;
  for(const r of rows){
    if(r.state!=="live")continue;const d=(camZ-MISS)-r.z;let filled=0;for(const v of r.seats)if(v!=null)filled++;
    for(let c=0;c<6;c++){
      const m=r.mats[c];let R=0,Gc=0,Bc=0;
      if(preview.row===r&&preview.seats.includes(c)){R=.1;Gc=.55+.15*Math.sin(clock*12);Bc=.2}
      else if(playing&&d<3.5){R=(.4+.4*Math.sin(clock*14))*(1-d/3.5)}
      else if(rainbowSeats){m.emissive.setHSL((clock*.4+c*.12+r.z*.03)%1,1,hyper>0?.3:.15);continue}
      else if(filled===5){const k=.12+.08*Math.sin(clock*6);R=k;Gc=k*.75}
      else if(playing&&fever>0){const k=.1+.08*Math.sin(clock*8+c+r.z);R=k;Bc=k*.8}
      m.emissive.setRGB(R,Gc,Bc);
    }
    const excited=filled>=4||hyper>0,sp=3+heat*5;
    for(const p of r.pax){if(!p||p.userData.busy)continue;const ph=p.userData.ph;
      p.rotation.y=Math.sin(clock*.7+ph)*.35;
      if(excited){p.position.y=Math.abs(Math.sin(clock*(hyper>0?12:8)+ph))*(hyper>0?.3:.12);p.scale.y=1}
      else{p.position.y=0;p.scale.y=1+Math.sin(clock*sp+ph)*(.03+heat*.04)}}
  }
  if(!playing&&rows.length&&Math.random()<dt*2){const r=pick(rows),p=pick(r.pax);if(p&&!p.userData.busy){p.userData.busy=true;tween(.45,k=>{p.position.y=Math.sin(k*Math.PI)*.5;p.rotation.y=k*Math.PI*2},()=>{p.position.y=0;p.userData.busy=false})}}
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.d);tw.update(k);if(k>=1){tweens.splice(i,1);tw.done&&tw.done()}}
  shakeT=Math.max(0,shakeT-dt);const sh=shakeT*.6+(fever>0?.04:0)+(hyper>0?.06:0),spd=playing?speed:1.4;
  cam.position.set(Math.sin(clock*.6)*.15+(Math.random()-.5)*sh,CAMY+Math.sin(clock*7)*.02*Math.min(spd,4)+(Math.random()-.5)*sh,camZ);
  cam.lookAt(0,.3,camZ-LOOK);
  if(missDirty)computeMiss();
  const Pz=camZ-L/2+10;for(const m of follow)m.position.z=Pz;
  roadTex.offset.y=-Pz*roadTex.repeat.y/L;floorTex.offset.y=-Pz*floorTex.repeat.y/L;paveTex.offset.y=-Pz*paveTex.repeat.y/L;
  for(const p of pyramids)p.position.z=camZ+p.userData.dz;
  sky.position.set(0,0,camZ);sunSprite.position.set(10,9,camZ-90);
  sun.position.set(5,11,camZ+4);sun.target.position.set(0,0,camZ-8);
  danger.visible=dangerGlow.visible=playing||state==="count"||state==="paused";
  danger.position.z=camZ-MISS;dangerGlow.position.z=camZ-MISS-.6;danger.material.opacity=.7+.3*Math.sin(clock*8);
  renderer.shadowMap.needsUpdate=renderer.shadowMap.enabled&&frameN%2===0;
  if(dt>.026&&document.visibilityState==="visible"){slowT+=dt;if(slowT>2.5){slowT=0;if(quality>1){quality=1;renderer.setPixelRatio(1);resize()}else if(renderer.shadowMap.enabled){renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material&&o.material.isMaterial)o.material.needsUpdate=true})}}}else slowT=Math.max(0,slowT-dt*.5);
  renderer.render(scene,cam);
  drawFx(ts,dt);
}
buildSegGeos();applyPlace();syncToggles();setState("home");attract();resize();requestAnimationFrame(frame);
})();
</script>

</body>
